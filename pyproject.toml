[project]
name = "foundationpose-perception-pipeline"
version = "0.1.0"
description = "depth -> SAM3 -> FoundationPose evaluation pipeline for BOP-format datasets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

# Version floors are the versions this was developed and measured against.
#
# The UPPER bounds are load-bearing, not caution. sam3 pins numpy<2; current opencv (5.x) and
# scipy (>=1.16) require numpy>=2 and will silently pull it in, breaking sam3 at import time.
# Each `pip install` resolves on its own, so this never surfaces as a conflict -- it just
# leaves a venv where `import sam3` fails. Verify with:
#   python -c "import numpy, cv2, scipy; print(numpy.__version__)"   # expect 1.26.x
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python<5",
  "scipy<1.16",
  "pyyaml>=6",
  # Pinned exactly, not floored: these are the versions the reported metrics were measured on,
  # and a resolver left to its own devices picks a newer torch with a different CUDA build.
  "torch==2.10.0",
  "torchvision==0.25.0",
  "pillow>=11",
  "tqdm>=4.66",
  # sam3 imports these at load time but does not declare them in its own core dependencies.
  "einops>=0.8",
  "pycocotools>=2.0.10",
  "psutil>=7",
  # `nvidia-tao-deploy` is installed with --no-deps (see the block below), which skips all 38 of
  # its declared pins. Two of them are on the import path the depth stage actually executes:
  # `nvidia_tao_deploy/utils/image_batcher.py` imports omegaconf, and imports
  # `cv/depth_net/utils.py`, which imports matplotlib for a colormap. Both are at module scope,
  # so `from nvidia_tao_deploy.cv.depth_net.inferencer import DepthNetInferencer` raises
  # ModuleNotFoundError without them and there is no depth at all. Declared here rather than
  # installed by hand alongside tao-deploy, because a later `uv sync` prunes anything not in the
  # lock.
  "omegaconf>=2.3",
  "matplotlib>=3.8",
  # sam3/model_builder.py does `import pkg_resources`, which ships inside setuptools and was
  # REMOVED in setuptools 81. Without this bound a fresh venv resolves setuptools >=81 and every
  # `import sam3` dies with ModuleNotFoundError: No module named 'pkg_resources'. Existing venvs
  # created before that release keep working, which is exactly why this is easy to miss.
  "setuptools<81",
]

# Deliberately NOT declared as dependencies:
#
# - sam3            external checkout with a gated model checkpoint. Install it editable from
#                   the sibling clone: `uv pip install -e ../sam3`. A bare `sam3` on PyPI is a
#                   different package.
# - FoundationPose  external checkout, injected via FOUNDATIONPOSE_ROOT / PYTHONPATH.
#
# CUDA-suffixed torch wheels are not on PyPI. The [tool.uv.index] block below points uv at the
# cu128 index so `uv sync` resolves the +cu128 build rather than a CPU one. With plain pip:
#   pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128

[project.optional-dependencies]
# Markdown -> HTML, for turning a sweep's `report.md` files into one bundled document. Nothing
# on the pipeline's own path imports it, so this stays optional.
report = ["markdown>=3.5"]
# Pinned exactly, not floored. ruff's DEFAULT rule set moves between releases, so an unbounded
# specifier silently changes the verdict: measured on this tree, ruff 0.6.0 reports 1 finding
# and 0.16.2 reports 153, with no code change. `[tool.ruff.lint] select` below fixes *which*
# rules run; this pin fixes the implementation of them. Upgrade deliberately, not by resolver.
dev = ["ruff==0.16.2"]
# What FoundationPose's libfoundation_pose_nvidia.so links against. Declared as an extra rather
# than installed ad-hoc after `uv sync`, because a later `uv sync` prunes anything not in the
# lock -- which would silently remove these and break the pose stage.
foundationpose = [
  # TAO Deploy also runs on whatever TensorRT is installed and declares none itself, so this is
  # the single place the version is pinned. Moving it means rebuilding every depth engine, which
  # is TensorRT-version-specific.
  "tensorrt-cu13==10.16.1.11",   # matches the inference library's TensorRT 10.16
  "nvidia-cuda-runtime",         # provides libcudart.so.13
]

# The commercially-licensable FoundationStereo path: the NGC `deployable_*` exports run through
# TAO Deploy, in THIS environment. See README.md's FoundationStereo section.
#
# DELIBERATELY NOT AN EXTRA. `nvidia-tao-deploy` pins `scipy==1.17.1`, which requires numpy>=2,
# against this project's `scipy<1.16` (which sam3 forces). Declaring it under
# [project.optional-dependencies] therefore makes the PROJECT unresolvable -- `uv lock` and every
# `uv sync`, including `--extra foundationpose`, fail with "your project's requirements are
# unsatisfiable" on a clean checkout, whether or not anyone asks for that extra. Do not
# re-introduce it as an extra.
#
# Install it out-of-band instead, which is what it always needed anyway:
#
#   uv pip install --python .venv/bin/python --no-deps nvidia-tao-deploy==7.1.0
#   uv pip install --python .venv/bin/python pycuda
#
# `--no-deps` is the point: those 38 `==` pins include scipy, mpi4py, PyInstaller, pyarmor and
# nvidia-eff (not on public PyPI). It does mean the two it skips that ARE needed -- omegaconf and
# matplotlib -- must come from somewhere, so they are declared as project dependencies above.
# Everything else TAO Deploy imports on this path is already a dependency or one of these lines.
#
# The version is pinned because `cv/depth_net` is not usable in every release -- 6.25.10 ships no
# `nvidia_tao_deploy/config/` at all, so its depth_net scripts cannot be imported. TensorRT comes
# from the `foundationpose` extra; TAO Deploy declares none itself and runs on what is installed.
#
# pycuda is an sdist on PyPI (no wheels), so pip compiles it. Its extension is C++ over the CUDA
# driver API -- no `.cu` files -- but it needs the CUDA toolkit's headers and link libraries, and
# its setup.py finds them by locating `nvcc` on PATH. A CUDA toolkit install is therefore a
# build-time prerequisite; set CUDA_ROOT if nvcc is not on PATH.

# No [project.scripts]: entry points stay as plain `python script/run_pipeline.py`, so the tree
# itself documents what is runnable. They can be added later without moving any file.

[build-system]
# setuptools>=77 is what supports the PEP 639 `license`/`license-files` fields declared above.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# CUDA wheels live on PyTorch's own index, not PyPI. `explicit = true` means only the packages
# routed here in [tool.uv.sources] use it -- everything else still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 110
src = ["src", "script", "test", "tools"]
# Nothing is excluded by path. A file that needs different rules -- because it runs under another
# interpreter, say -- carries its own file-level directive instead, local to where it applies.
extend-exclude = []

[tool.ruff.lint]
# DECLARED, not inherited. ruff's default rule set changes between releases, so leaving this out
# makes the lint verdict a function of which ruff got installed: measured on this tree, 0.6.0
# reported 1 finding and 0.16.2 reported 155, with no code change in between. Together with the
# exact `ruff==0.16.2` pin in the dev extra, this makes "lint is clean" a reproducible claim.
#
# E4/E7/E9 rather than a bare "E": that is ruff's own default slice of pycodestyle, and it leaves
# out E501 (line-too-long).
#
# E501 IS DELIBERATELY OFF, and the decision was measured rather than assumed (2026-08-19):
#
#     lines > 110: 85      lines > 130: 20      lines > 160: 13      lines > 200: 4
#
# and ALL 13 of the lines over 160 characters are in `evaluation/report.py` -- they are Markdown
# template text that becomes lines of the generated `report.md`. So the worst offenders are
# exactly the population that must NOT be wrapped: splitting them either changes the report's
# output or requires implicit concatenation whose join points silently drop a space, and it stops
# a report line being readable as one line in the source. Of the remainder, most sit 1-10
# characters over, where wrapping buys nothing.
#
# `line-length = 110` above still governs any formatting run, so `ruff format` remains the
# one-command path if this is ever revisited -- but that reformats every file, which is a
# deliberate style decision this repo has so far declined to make (it ships no formatter).
#
# CONSEQUENCE FOR QA: a test whose pass criterion reads "line-length 110 respected" is not
# satisfied by this configuration and should be amended to match it.
#
# E402 is listed explicitly and is load-bearing: ~37 imports sit after `sys.path` setup and carry
# `# noqa: E402`. It left ruff's defaults in a later release, which silently turned every one of
# those directives into dead code AND stopped enforcing the thing they documented.
select = [
    "E4", "E7", "E9", "E402",  # pycodestyle: the errors that are not formatting opinions
    "F",                        # pyflakes
    "I",                        # import sorting
    "UP",                       # pyupgrade -- the floor is Python 3.12, so these are safe
    "B",                        # bugbear
    "SIM",                      # simplify
    "RUF",                      # ruff's own
    "BLE",                      # blind except -- swallowing errors hid real failures here before
    "DTZ",                      # naive datetimes -- these stamp report provenance
    "PLW",                      # pylint warnings, incl. subprocess-run-without-check
    "S110",                     # try/except/pass specifically, not all of bandit
    "FURB",                     # modernisation
]
